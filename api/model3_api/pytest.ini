[pytest]
# Pytest configuration file
# Tests should be run from the project root

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths (relative to project root)
testpaths = api/model3_api/tests

# Coverage options
# Note: When running from project root, use: pytest api/model3_api/tests
# Coverage path is relative to where pytest is executed
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=api/model3_api/app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# Minimum Python version
minversion = 3.8

